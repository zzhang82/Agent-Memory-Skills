name: amb-connect
display_name: AMB Connect & Host Integration
short_description: Connect an agent host to AMB, choose transports, and verify connectivity.
description: "Use when connecting Agent Memory Bridge (AMB) v0.39 to an agent host, running one-command connectors or the 3-tier connection check, choosing local stdio or remote Streamable HTTP, deploying Docker authority, limiting exposed tools, wiring packaged per-client triggers or generic lifecycle hooks, or diagnosing disconnected memory."
default_prompt: "Follow the 5-stage connection protocol: discover host capabilities, select authority and transport (previewing with `connect <client> --dry-run` before running `connect <client>` for Claude Code, Cursor, Codex, Cline, or VS Code), set tool profile (default Everyday 6), wire optional per-client triggers (previewing with `triggers install <client> --dry-run`), and verify with `connect <client> --check`, `doctor`, and the two-session first win."
